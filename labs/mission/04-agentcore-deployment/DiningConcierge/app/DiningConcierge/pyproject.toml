[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "DiningConcierge"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore[strands-agents] >= 1.15",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.27",
    "mcp-proxy-for-aws",
    "strands-agents >= 1.43",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
