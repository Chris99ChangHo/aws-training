# This file intentionally uses TOML, not YAML.
# Python's standard library ships a TOML parser (tomllib, 3.11+) but no YAML
# parser, so TOML keeps the build step dependency-free.

[agent]
name = "generic-devops-agent"
description = """\
Vendor-agnostic DevOps specialist. Reviews infrastructure-as-code, container \
builds and CI pipelines for misconfiguration and operability gaps using \
open-source linters, and gates a change on the merged SARIF report. Reads \
infrastructure state but never mutates it. Use for IaC review, pipeline \
review, or release readiness checks."""
prompt_file = "SYSTEM_PROMPT.md"
welcome = "Generic DevOps Agent ready. Plan and inspect only -- apply, destroy and delete are blocked."

# Harness-specific model identifiers. This is one of only two places where
# vendor names appear in the neutral source; keeping them here rather than in
# the adapters means the adapters stay fully generated.
[model]
kiro = "claude-opus-5"
claude_code = "opus"
codex = "gpt-5.6"

# Neutral capability names. build.py maps these onto each harness's tool names.
[capabilities]
read_files = true
write_files = true
run_shell = true
search_code = true
fetch_web = false          # findings must come from the repo and the linters

# Auto-approved: read-only, no side effects outside the workspace.
auto_approve = ["read_files", "search_code"]

[shell]
# Commands the agent may run without asking. Anchored at both ends by build.py.
#
# `{lab}` expands to this agent's path relative to the workspace root, `{core}`
# to the shared code. Write them explicitly rather than letting the builder
# guess which patterns are paths.
auto_approve_commands = [
    "{lab}/scanners/preflight\\.sh",
    "{lab}/scanners/run_iac\\.sh( [A-Za-z0-9._/-]+)?",
    "{lab}/scanners/run_pipeline\\.sh( [A-Za-z0-9._/-]+)?",
    "{core}/gate/merge_sarif\\.py( [A-Za-z0-9._/-]+)*",
    "{core}/gate/gate\\.py( [A-Za-z0-9._/=-]+)*",
    "git (status|diff|log)( [A-Za-z0-9._/-]+)*",
]

# Always denied, regardless of any allow rule. Deny is evaluated first in every
# harness. These are a coarse backstop; guard_infra.sh is the real control
# because it parses the command instead of pattern-matching the raw string.
#
# The infrastructure entries are what make this a DevOps agent rather than a
# copy of the security one. A security agent reads code; a DevOps agent is one
# typo away from deleting a production cluster, so every state-changing verb is
# denied and only plan/inspect survives.
deny_commands = [
    ".*[;&|`].*",              # command chaining / substitution
    ".*\\$\\(.*",              # command substitution
    ".*\\b(sudo|su|doas)\\b.*",
    ".*\\brm\\b.*",
    ".*\\b(dd|mkfs|shred|truncate)\\b.*",
    ".*\\bchmod\\s+777\\b.*",
    ".*(\\.aws/|\\.ssh/|\\.env|id_rsa|id_ed25519|credentials).*",
    ".*\\b(curl|wget)\\b.*",   # no outbound exfiltration path
    ".*\\bterraform\\s+(apply|destroy|import|taint|state)\\b.*",
    ".*\\b(kubectl|helm)\\s+(apply|delete|create|replace|patch|scale|rollout|drain|uninstall|upgrade)\\b.*",
    ".*\\bdocker\\s+(run|rm|rmi|push|system|volume)\\b.*",
    ".*\\baws\\s+\\S+\\s+(create|delete|update|put|modify|terminate|attach|detach)\\S*\\b.*",
]

[hooks]
# PreToolUse gate. Receives the pending tool call as JSON on stdin and blocks
# with exit code 2. The hook exists because an allow-list regex cannot tell
# `terraform plan` from `terraform plan -destroy`, or read-only `aws ec2
# describe-*` from a mutation hidden behind an alias.
pre_tool_use = "scanners/guard_infra.sh"
spawn = "scanners/preflight.sh"

[scanners]
iac = "trivy"               # config mode: Terraform, CloudFormation, K8s, Dockerfile
dockerfile = "hadolint"
pipeline = "actionlint"
report_format = "sarif"     # OASIS SARIF 2.1.0

[gate]
# Tier 3: deterministic CI gating. No LLM involved in this decision.
# Same contract as the security agent, read by the shared gate in agents/core.
fail_on_severity = "high"    # fail the build at this level or above
max_allowed = 0

[mcp]
server_name = "devops-linters"
server_command = "mcp/server.py"
